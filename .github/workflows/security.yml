name: Security scans

# Scans de securite automatiques a chaque push et PR:
#   - gitleaks: cherche les secrets accidentellement commites
#   - npm audit: cherche les vulnerabilites des dependances admin-app
#
# Les jobs echouent en cas de finding, ce qui bloque le merge (via branch
# protection GitHub si activee).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Concurrence: annule les runs precedents sur la meme branche si un
# nouveau push arrive.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Permissions minimales — gitleaks a besoin de contents:read + pull-requests:read
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks (secrets scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 permet a gitleaks de scanner tout l'historique
          # (pas juste le dernier commit).
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Token GitHub automatique — requis par gitleaks-action v2
          # pour scanner les PRs
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Utilise notre config custom .gitleaks.toml (regles + allowlist)
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
          # Aucune telemetrie externe
          GITLEAKS_NOTIFY_USER_LIST: ""

  npm-audit-admin:
    name: npm audit (admin-app)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22 = version LTS active. Notre package.json exige >= 20.
          node-version: '22'
          # PAS de cache: package-lock.json n'est pas commite dans le repo
          # (build Vercel le regenere a chaque deploiement). Le cache
          # setup-node echouerait sans lock.

      # Installe sans lock et sans executer les scripts postinstall
      # (evite d'exposer le runner a du code arbitraire).
      - name: Install dependencies (sans scripts)
        working-directory: admin-app
        run: npm install --no-audit --no-fund --ignore-scripts

      # `npm audit` retourne un exit code non-zero si des vulns sont
      # trouvees. --audit-level=high bloque uniquement sur high/critical
      # (les moderate/low apparaissent en warning sans bloquer).
      - name: Run npm audit
        working-directory: admin-app
        run: npm audit --audit-level=high --production
